[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-arabic-toolkit"
version = "0.1.0"
description = "High-performance Model Context Protocol (MCP) server for Arabic NLP, normalization, and dialect classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tarek Mohamed", email = "seotarek@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "arabic-nlp",
    "arabic",
    "dialect-detection",
    "text-normalization",
    "llm",
    "ai-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.scripts]
mcp-arabic-toolkit = "mcp_arabic.server:run_stdio_server"

[project.urls]
Homepage = "https://github.com/seotarek/mcp-arabic-toolkit"
Repository = "https://github.com/seotarek/mcp-arabic-toolkit"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_arabic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
